[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmarks for local LLM servers (colibri, llama.cpp) on consumer GPU hardware"
readme = "README.md"
authors = [
    { name = "Sebastian Heiden", email = "sehHeiden@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
serve-bench = "llm_bench.serve_bench:main"
standalone-bench = "llm_bench.standalone_bench:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["S101", "S108", "S310", "S403", "S404", "S603", "S607"]

