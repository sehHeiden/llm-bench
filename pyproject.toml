[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmarks for local LLM servers (colibri, llama.cpp) on consumer GPU hardware"
readme = "README.md"
authors = [
    { name = "Sebastian Heiden", email = "sehHeiden@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty>=0.0.1a19",
]

[project.scripts]
bench = "llm_bench.bench:main"
analyze = "llm_bench.analyze:main"
notify = "llm_bench.notify:main"
run-all = "llm_bench.run_all:main"
run-llama = "llm_bench.run_llama:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [".eggs", ".git", ".venv", ".ipynb_checkpoints"]
include = ["*.py", "*.ipynb"]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D212", "ISC001", "COM812", "E501", "T201", "CPY001"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/llm_bench/*.py" = [
    "S101",    # assert statements
    "S108",    # /tmp usage (heat file)
    "S310",    # urllib http calls
    "S403",    # subprocess
    "S404",    # subprocess module
    "S603",    # subprocess.run
    "S607",    # subprocess with partial path
    "PLC0415", # imports inside functions
    "CPY001",  # no copyright header (bench-tool)
    "EXE001",  # shebang in library module
    "PLR0913", # too many args (bench internal helpers)
    "PLR0917", # too many positional args (bench internal helpers)
    "TRY004",  # TypeError vs ValueError (bench parsing)
    "EM102",   # exception with f-string (bench)
    "TRY003",  # long exception messages (bench)
]

[tool.ty.environment]
python-version = "3.13"

